{{ define "main" }}
{{ partial "page-header.html" . }}
<section class="section pt-0!">
  <div class="container">
    <div class="section row pb-0">
       <div class="content col-12 md:col-6 ">
        {{ .Content }}
      </div>
      <div class="col-12 md:col-6">
        <form id="contact-form" class="contact-form" method="POST">
          <input type="hidden" name="access_key" value="96e7d004-e426-4ac1-98f0-d2ff8a273293">
          <input type="hidden" name="subject" value="New message from the DeThenCo website">
          <input type="checkbox" name="botcheck" class="hidden" style="display:none">
          <div class="mb-3">
            <input class="form-input w-full rounded" name="first_name" type="text" placeholder="{{ i18n `fname` }}" required>
          </div>
          <div class="mb-3">
            <input class="form-input w-full rounded" name="last_name" type="text" placeholder="{{ i18n `lname` }}" required>
          </div>
          <div class="mb-3">
            <input class="form-input w-full rounded" name="email" type="email" placeholder="{{ i18n `email` }}" required>
          </div>
          <div class="mb-3">
            <textarea class="form-textarea w-full rounded-md" name="message" rows="5" placeholder="{{ i18n `message` }}"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">{{ i18n "send" }}</button>
          <p id="contact-form-status" class="mt-3 mb-0"></p>
        </form>
      </div>

    </div>
  </div>
</section>

<script>
  (function () {
    var form = document.getElementById("contact-form");
    var status = document.getElementById("contact-form-status");
    if (!form) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      status.textContent = "Sending...";
      fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new FormData(form),
      })
        .then(function (res) { return res.json(); })
        .then(function (json) {
          submitBtn.disabled = false;
          if (json.success) {
            status.textContent = "Thanks — your message has been sent. We'll get back to you soon.";
            form.reset();
          } else {
            status.textContent = "Something went wrong. Please try again or email us directly.";
          }
        })
        .catch(function () {
          submitBtn.disabled = false;
          status.textContent = "Something went wrong. Please try again or email us directly.";
        });
    });
  })();
</script>
{{ end }}
